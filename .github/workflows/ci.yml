name: CLI checks

on:
  push:
  pull_request:

jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n jfk-macmdm-lab.sh && bash -n tests/test-cli.sh
      - name: CLI tests (hardware paths mocked)
        run: bash tests/test-cli.sh
      - name: Smoke-test native host
        run: bash jfk-macmdm-lab.sh --quick
