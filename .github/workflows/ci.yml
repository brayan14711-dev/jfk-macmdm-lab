name: CLI checks

on:
  push:
  pull_request:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n jfk-macmdm-lab.sh && bash -n tests/test-cli.sh
      - name: CLI tests (hardware paths mocked)
        run: bash tests/test-cli.sh
